# Fallback only: BuildAGoat.xcodeproj is already included.
# If Xcode refuses to open it, regenerate with:  brew install xcodegen && xcodegen
name: BuildAGoat
options:
  bundleIdPrefix: com.buildagoat
  deploymentTarget:
    iOS: "17.0"
packages:
  BuildAGoatKit:
    path: Packages/BuildAGoatKit
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  BuildAGoat:
    type: application
    platform: iOS
    sources: [BuildAGoat]
    dependencies:
      - package: BuildAGoatKit
        product: GoatPresentation
      - package: BuildAGoatKit
        product: GoatData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buildagoat.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Build a GOAT"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
